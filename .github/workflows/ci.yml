name: Validate reusable accelerator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate deployment contracts without credentials
        run: ghcp-metrics validate --config config/config.example.yml
      - name: Test offline behavior
        run: python -m pytest --cov=copilot_metrics_fabric --cov-report=term-missing
      - name: Lint
        run: python -m ruff check .
      - name: Build distribution
        run: python -m build
